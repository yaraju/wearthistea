name: Deploy to Google Cloud

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: wearthistea
  REPOSITORY: wearthistea

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Container
        run: |-
          docker build -t "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}" .
          docker push "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=10
          env_vars: |
            NODE_ENV=production
            GCS_BUCKET=${{ secrets.GCS_BUCKET }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            PRINTIFY_API_TOKEN=${{ secrets.PRINTIFY_API_TOKEN }}
            PRINTIFY_SHOP_ID=${{ secrets.PRINTIFY_SHOP_ID }}
            PRINT_PROVIDER=${{ secrets.PRINT_PROVIDER }}
            PRINTROVE_EMAIL=${{ secrets.PRINTROVE_EMAIL }}
            PRINTROVE_PASSWORD=${{ secrets.PRINTROVE_PASSWORD }}
            PRINTROVE_PRODUCT_ID=${{ secrets.PRINTROVE_PRODUCT_ID }}
            PRINTROVE_PRODUCT_SUBTYPE_ID=${{ secrets.PRINTROVE_PRODUCT_SUBTYPE_ID }}
            PRINTROVE_VARIANT_MAP=${{ secrets.PRINTROVE_VARIANT_MAP }}
            BASIC_AUTH_USER=${{ secrets.BASIC_AUTH_USER }}
            BASIC_AUTH_PASSWORD=${{ secrets.BASIC_AUTH_PASSWORD }}

      - name: Deploy to Firebase Hosting
        run: |
          npx --yes firebase-tools hosting:sites:list --project ${{ env.PROJECT_ID }}
          # Create the site if it doesn't exist
          npx --yes firebase-tools hosting:sites:create ${{ env.PROJECT_ID }} --project ${{ env.PROJECT_ID }} || true
          # Inject site ID into firebase.json to avoid ambiguity
          # Using python for JSON manipulation as it's guaranteed to be available
          python3 -c "import json; d = json.load(open('firebase.json')); d['hosting']['site'] = '${{ env.PROJECT_ID }}'; json.dump(d, open('firebase.json', 'w'), indent=2)"
          npx --yes firebase-tools deploy --only hosting --project ${{ env.PROJECT_ID }} --non-interactive
