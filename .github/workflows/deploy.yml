# Deploy to Google Cloud and Firebase Hosting
name: Build and Deploy to GCP

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: wearthistea
  REGION: us-central1
  SERVICE_NAME: wearthistea
  REPOSITORY: wearthistea

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Ensure Cloud Tasks queues
        shell: bash
        env:
          EMAIL_QUEUE: ${{ secrets.CLOUD_TASKS_QUEUE_EMAIL }}
          PRINTROVE_QUEUE: ${{ secrets.CLOUD_TASKS_QUEUE_PRINTROVE }}
          # Not a secret — a queue name isn't sensitive, so this one's just a
          # literal here rather than adding a third repo secret for it.
          RENDER_QUEUE: design-render
          # Same reasoning as RENDER_QUEUE — three more literal, non-secret
          # queue names for the judge/fix/regenerate chain (issue #13),
          # deliberately separate queues (not folded into RENDER_QUEUE) so
          # each workload's dispatch/concurrency profile can be tuned
          # independently — a cheap pixel-level fix, an LLM vision judge
          # call, and a full image regeneration have very different cost
          # and latency shapes.
          JUDGE_QUEUE: design-judge
          FIX_QUEUE: design-fix
          REGENERATE_QUEUE: design-regenerate
          # Bulk judge run (issue #19) — same reasoning as the four above:
          # a non-secret, literal queue name.
          JUDGE_RUN_QUEUE: design-judge-run
        run: |
          gcloud services enable cloudtasks.googleapis.com --project="${{ env.PROJECT_ID }}"

          # Idempotent: create the queue if it's missing, otherwise just
          # reconcile its config — so retry-tuning changes here take effect
          # on the next deploy without a manual `gcloud tasks queues update`.
          ensure_queue() {
            local name="$1"; shift
            if [ -z "$name" ]; then
              echo "Skipping queue creation — no queue name secret set." >&2
              return
            fi
            if gcloud tasks queues describe "$name" \
                --location="${{ env.REGION }}" --project="${{ env.PROJECT_ID }}" >/dev/null 2>&1; then
              echo "Queue '$name' already exists — reconciling its config."
              gcloud tasks queues update "$name" \
                --location="${{ env.REGION }}" --project="${{ env.PROJECT_ID }}" "$@"
            else
              echo "Queue '$name' not found — creating it."
              gcloud tasks queues create "$name" \
                --location="${{ env.REGION }}" --project="${{ env.PROJECT_ID }}" "$@"
            fi
          }

          # Email: light HTTP calls to SendGrid, fine to run with more
          # concurrency and a shorter backoff ceiling.
          ensure_queue "$EMAIL_QUEUE" \
            --max-attempts=5 \
            --max-retry-duration=3600s \
            --min-backoff=10s \
            --max-backoff=300s \
            --max-doublings=4 \
            --max-concurrent-dispatches=10 \
            --max-dispatches-per-second=5

          # Printrove product-library creation: an upload + several
          # sequential create-product calls per task against a third-party
          # API — deliberately throttled so we don't hammer Printrove across
          # many designs at once, and given a longer retry window since a
          # transient Printrove outage shouldn't lose the task.
          ensure_queue "$PRINTROVE_QUEUE" \
            --max-attempts=3 \
            --max-retry-duration=10800s \
            --min-backoff=30s \
            --max-backoff=600s \
            --max-doublings=3 \
            --max-concurrent-dispatches=3 \
            --max-dispatches-per-second=1

          # Design-render: one Gemini image call + mockup composite + back
          # print per task — the actual brewing latency the customer is
          # watching for, so a fair amount of concurrency (each render lands
          # on whichever Cloud Run instance has a slot) and a retry window
          # long enough to ride out a Gemini 429/503 without giving up.
          ensure_queue "$RENDER_QUEUE" \
            --max-attempts=4 \
            --max-retry-duration=1800s \
            --min-backoff=10s \
            --max-backoff=120s \
            --max-doublings=4 \
            --max-concurrent-dispatches=10 \
            --max-dispatches-per-second=5

          # Design-judge: one Gemini multimodal vision call + a sharp
          # luminance measurement per task — cheap and fast, but shares
          # Gemini's own rate limits with rendering, so kept at a lower
          # concurrency than render rather than piling on independently.
          ensure_queue "$JUDGE_QUEUE" \
            --max-attempts=4 \
            --max-retry-duration=1800s \
            --min-backoff=10s \
            --max-backoff=120s \
            --max-doublings=4 \
            --max-concurrent-dispatches=5 \
            --max-dispatches-per-second=5

          # Design-fix: cheap programmatic pixel ops (issue #14), no LLM
          # call at all once implemented — generous concurrency, shorter
          # backoff ceiling, same shape as the email queue's tuning.
          ensure_queue "$FIX_QUEUE" \
            --max-attempts=5 \
            --max-retry-duration=3600s \
            --min-backoff=10s \
            --max-backoff=300s \
            --max-doublings=4 \
            --max-concurrent-dispatches=10 \
            --max-dispatches-per-second=5

          # Design-regenerate: a full Gemini image render + mockup composite
          # + back print for a brand-new sibling design (issue #15) — same
          # cost shape as render, but capped at a single attempt by
          # REGEN_ATTEMPT_CAP application-side, so kept at lower concurrency
          # than render to leave headroom for the customer-facing path.
          ensure_queue "$REGENERATE_QUEUE" \
            --max-attempts=4 \
            --max-retry-duration=1800s \
            --min-backoff=10s \
            --max-backoff=120s \
            --max-doublings=4 \
            --max-concurrent-dispatches=5 \
            --max-dispatches-per-second=3

          # Judge-run step (issue #19): one design's worth of work per task
          # (a judge call, plus — auto mode only, on a failure — the same
          # regenerate cost as REGENERATE_QUEUE above), self-chained one
          # step at a time by /api/tasks/judge-run-step, so low concurrency
          # is fine — a bulk run's own pace is bounded by its own admin-
          # chosen --limit, not by how fast this queue can fan out.
          ensure_queue "$JUDGE_RUN_QUEUE" \
            --max-attempts=4 \
            --max-retry-duration=1800s \
            --min-backoff=10s \
            --max-backoff=120s \
            --max-doublings=4 \
            --max-concurrent-dispatches=3 \
            --max-dispatches-per-second=3

      - name: Prepare Env Vars
        id: prep
        shell: bash
        env:
          VARIANT_MAP: ${{ secrets.PRINTROVE_VARIANT_MAP }}
        run: |
          # Clean variables: remove newlines and optional surrounding quotes
          clean_var() {
            tr -d '\n\r' | sed "s/^ *//;s/ *$//;s/^'//;s/'$//;s/^\"//;s/\"$//;"
          }

          echo "variant_map=$(echo "$VARIANT_MAP" | clean_var)" >> $GITHUB_OUTPUT

          # Direct Cloud Run URL for Cloud Tasks dispatch (issue #33) — bypasses
          # Firebase Hosting's ~60s proxy cutoff, which 504'd long renders and
          # made Cloud Tasks redeliver them. Empty on the very first deploy
          # (service doesn't exist yet) -> tasks fall back to SITE_URL.
          echo "run_url=$(gcloud run services describe "${{ env.SERVICE_NAME }}" --region="${{ env.REGION }}" --project="${{ env.PROJECT_ID }}" --format='value(status.url)' 2>/dev/null || true)" >> $GITHUB_OUTPUT

      - name: Build and Push Container
        run: |-
          docker build \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}" \
            --build-arg NEXT_PUBLIC_GA_MEASUREMENT_ID="${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}" \
            -t "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}" .
          docker push "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --memory=2Gi
            --cpu=2
            --min-instances=0
            --max-instances=10
          env_vars: |
            NODE_ENV=production
            GCS_BUCKET=${{ secrets.GCS_BUCKET }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GEMINI_IMAGEN_FAST_MODEL=gemini-nano-banana-2.1
            GEMINI_IMAGE_MODEL=gemini-nano-banana-2.1
            GEMINI_IMAGE_BACKUP_MODEL=gemini-3.1-flash-lite-image
            TYPESAFE_API_KEY=${{ secrets.TYPESAFE_API_KEY }}
            DECISION_GATE=off
            PRINTIFY_API_TOKEN=${{ secrets.PRINTIFY_API_TOKEN }}
            PRINTIFY_SHOP_ID=${{ secrets.PRINTIFY_SHOP_ID }}
            PRINT_PROVIDER=${{ secrets.PRINT_PROVIDER }}
            PRINTROVE_EMAIL=${{ secrets.PRINTROVE_EMAIL }}
            PRINTROVE_PASSWORD=${{ secrets.PRINTROVE_PASSWORD }}
            PRINTROVE_PRODUCT_ID=${{ secrets.PRINTROVE_PRODUCT_ID }}
            PRINTROVE_PRODUCT_SUBTYPE_ID=${{ secrets.PRINTROVE_PRODUCT_SUBTYPE_ID }}
            PRINTROVE_VARIANT_MAP=${{ steps.prep.outputs.variant_map }}
            NEXT_PUBLIC_LANGFUSE_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_LANGFUSE_PUBLIC_KEY }}
            LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}
            LANGFUSE_BASEURL=${{ secrets.LANGFUSE_BASEURL }}
            ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}
            RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
            RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
            RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
            SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            CLOUD_TASKS_QUEUE_EMAIL=${{ secrets.CLOUD_TASKS_QUEUE_EMAIL }}
            CLOUD_TASKS_QUEUE_PRINTROVE=${{ secrets.CLOUD_TASKS_QUEUE_PRINTROVE }}
            CLOUD_TASKS_QUEUE_RENDER=design-render
            CLOUD_TASKS_QUEUE_JUDGE=design-judge
            CLOUD_TASKS_QUEUE_FIX=design-fix
            CLOUD_TASKS_QUEUE_REGENERATE=design-regenerate
            CLOUD_TASKS_QUEUE_JUDGE_RUN=design-judge-run
            GCP_PROJECT_ID=${{ env.PROJECT_ID }}
            GCP_REGION=${{ env.REGION }}
            SITE_URL=${{ secrets.SITE_URL }}
            TASKS_TARGET_URL=${{ steps.prep.outputs.run_url }}
            TASKS_SHARED_SECRET=${{ secrets.TASKS_SHARED_SECRET }}
            SELLER_BUSINESS_NAME=${{ secrets.SELLER_BUSINESS_NAME }}
            SELLER_GSTIN=${{ secrets.SELLER_GSTIN }}
            SELLER_ADDRESS=${{ secrets.SELLER_ADDRESS }}
            SELLER_STATE=${{ secrets.SELLER_STATE }}
          env_vars_update_strategy: overwrite
          # Gemini models are literal (non-secret) so a deploy never wipes them
          # (strategy is overwrite). Rollback the image swap by changing
          # GEMINI_IMAGEN_FAST_MODEL back to gemini-3-pro-image. DECISION_GATE:
          # off | shadow | enforce (see docs/spike-system-one-decision-models.md);
          # needs the TYPESAFE_API_KEY repo secret for shadow/enforce.
          # BASIC_AUTH_USER/PASSWORD deliberately not set here — Razorpay's
          # onboarding needs the site reachable without a password prompt.
          # /admin and /api/admin/* are protected independently by the
          # Firebase Google-sign-in gate (src/lib/auth.ts). To turn Basic
          # Auth back on later, add BASIC_AUTH_USER/BASIC_AUTH_PASSWORD back
          # to this list, sourced from repo secrets of the same name.

      # Stuck-row watchdog (issue #33): every 10 minutes Cloud Scheduler POSTs
      # /api/tasks/sweep-stuck-validation (same X-Task-Secret auth as the
      # Cloud Tasks handlers), which retries once / rejects designs stranded
      # in validationStatus pending|validating|regenerating. Idempotent
      # create-or-update. Warns instead of failing the deploy if the deploy
      # service account lacks roles/cloudscheduler.admin (see GCP_SETUP.md).
      - name: Ensure stuck-row sweeper schedule
        shell: bash
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          TASKS_SHARED_SECRET: ${{ secrets.TASKS_SHARED_SECRET }}
        run: |
          JOB=sweep-stuck-validation
          URL="${SITE_URL%/}/api/tasks/sweep-stuck-validation"
          COMMON=(--project="${{ env.PROJECT_ID }}" --location="${{ env.REGION }}" \
            --schedule="*/10 * * * *" --time-zone="Etc/UTC" \
            --uri="$URL" --http-method=POST \
            --attempt-deadline=60s)
          (
            gcloud services enable cloudscheduler.googleapis.com --project="${{ env.PROJECT_ID }}" &&
            if gcloud scheduler jobs describe "$JOB" --project="${{ env.PROJECT_ID }}" --location="${{ env.REGION }}" >/dev/null 2>&1; then
              gcloud scheduler jobs update http "$JOB" "${COMMON[@]}" --update-headers="X-Task-Secret=$TASKS_SHARED_SECRET,Content-Type=application/json"
            else
              gcloud scheduler jobs create http "$JOB" "${COMMON[@]}" --headers="X-Task-Secret=$TASKS_SHARED_SECRET,Content-Type=application/json"
            fi
          ) || echo "::warning::Could not create/update the '$JOB' Cloud Scheduler job — see GCP_SETUP.md (stuck-row sweeper)."

      - name: Deploy to Firebase Hosting
        run: |
          npx --yes firebase-tools deploy --only hosting --project ${{ env.PROJECT_ID }} --non-interactive
